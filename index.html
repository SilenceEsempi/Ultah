<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Prank 👻</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    background:
    linear-gradient(
        135deg,
        #8b0000,
        #000000
    );
}

/* CARD */

.card{

    width:90%;
    max-width:430px;

    padding:30px;

    text-align:center;

    border-radius:28px;

    background:
    linear-gradient(
        180deg,
        #3b0000,
        #120000
    );

    border:4px solid black;

    box-shadow:
    8px 8px 0px black;
}

/* JUDUL */

h1{

    color:white;

    font-size:38px;

    margin-bottom:18px;

    text-shadow:
    3px 3px black;
}

/* TEXT */

p{

    color:white;

    font-size:22px;

    line-height:1.5;

    margin-bottom:24px;
}

/* GIF KUE */

.cake{

    width:220px;

    border-radius:20px;

    border:4px solid black;

    margin-bottom:24px;
}

/* BUTTON */

button{

    padding:15px 34px;

    font-size:22px;

    color:white;

    cursor:pointer;

    border-radius:999px;

    border:4px solid black;

    background:
    linear-gradient(
        180deg,
        #7a0000,
        #240000
    );

    box-shadow:
    5px 5px 0px black;

    transition:0.2s;
}

button:hover{

    transform:scale(1.05);
}

/* JUMPSCARE */

#jumpscare{

    position:fixed;

    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    background:black;

    z-index:9999;
}

#jumpscare img{

    width:100%;
    height:100%;

    object-fit:cover;

    animation:shake 0.05s infinite;
}

/* SHAKE */

@keyframes shake{

    0%{
        transform:translate(5px,5px);
    }

    25%{
        transform:translate(-5px,3px);
    }

    50%{
        transform:translate(4px,-5px);
    }

    75%{
        transform:translate(-4px,-4px);
    }

    100%{
        transform:translate(5px,-2px);
    }
}

</style>
</head>

<body>

<div class="card">

    <h1>
        🎉 HBD Moza... :D 🎉
    </h1>

    <p>
        Semoga panjang umur, sehat selalu,
        besuke kerja neng jepang 😄
    </p>

    <!-- GANTI JADI cake.gif -->
    <img
        class="cake"
        src="cake.gif"
        alt="cake"
    >

    <br>

    <button onclick="startPrank()">
        Foto Kenangan 🎁
    </button>

</div>

<!-- JUMPSCARE -->

<div id="jumpscare">

    <!-- PNG JUMPSCARE -->
    <img
        src="jumpscare.png"
        alt="jumpscare"
    >

    <!-- SOUND -->
    <audio id="sound" preload="auto">

        <source
            src="scream.mp3"
            type="audio/mpeg"
        >

    </audio>

</div>

<script>

function startPrank(){

    const jumpscare =
    document.getElementById("jumpscare");

    const sound =
    document.getElementById("sound");

    /* SOUND DULU BIAR GAK DELAY */

    sound.currentTime = 0;

    sound.play();

    /* FOTO MUNCUL LANGSUNG */

    jumpscare.style.display = "flex";

    /* FULLSCREEN */

    if(document.documentElement.requestFullscreen){

        document.documentElement.requestFullscreen();
    }
}

</script>

</body>
</html>
