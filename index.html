<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Prank 🎂</title>

<style>

:root{

    /* BACKGROUND */
    --bg1: #D91A1A;
    --bg2: #000000;

    /* CARD */
    --card-color: #420D09;

    /* TEKS */
    --title-color: #ffffff;
    --text-color: #333333;

    /* TOMBOL */
    --button-color: #420D09;
    --button-text: #ffffff;

    /* OUTLINE */
    --outline: #000000;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        135deg,
        var(--bg1),
        var(--bg2)
    );
}

.card{
    width:90%;
    max-width:420px;

    background:var(--card-color);

    padding:30px;

    text-align:center;

    border-radius:25px;

    border:4px solid var(--outline);

    box-shadow:8px 8px 0px black;
}

h1{
    color:var(--title-color);
    margin-bottom:15px;
}

p{
    color:var(--text-color);
    margin-bottom:20px;
}

.cake{
    width:200px;
    border-radius:20px;
    margin-bottom:20px;

    border:4px solid var(--outline);
}

button{

    background:var(--button-color);
    color:var(--button-text);

    padding:14px 28px;

    border-radius:999px;

    border:4px solid var(--outline);

    font-size:18px;
    cursor:pointer;

    transition:0.2s;

    box-shadow:5px 5px 0px black;
}

button:hover{
    transform:scale(1.05);
}

#jumpscare{
    position:fixed;
    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    background:black;

    z-index:9999;
}

#jumpscare img{
    width:100%;
    height:100%;

    object-fit:cover;

    animation:shake 0.06s infinite;
}

@keyframes shake{

    0%{
        transform:translate(4px,4px);
    }

    25%{
        transform:translate(-4px,2px);
    }

    50%{
        transform:translate(3px,-4px);
    }

    75%{
        transform:translate(-3px,-3px);
    }

    100%{
        transform:translate(4px,-2px);
    }
}

</style>
</head>

<body>

<div class="card">

    <h1>
        🎉 HBD moza :D 🎉
    </h1>

    <p>
        Mogahan impian dewek kerja jepang terwujud 😄
    </p>

    <!-- GAMBAR KUE -->
    <img
        class="cake"
        src="cake.gif"
        alt="cake"
    >

    <br>

    <button onclick="startPrank()">
        Foto Kenangan 🎁
    </button>

</div>

<!-- JUMPSCARE -->
<div id="jumpscare">

    <!-- PNG JUMPSCARE -->
    <img
        src="jumpscare.png"
        alt="jumpscare"
    >

    <!-- SOUND -->
    <audio id="sound">

        <source
            src="scream.mp3"
            type="audio/mpeg"
        >

    </audio>

</div>

<script>

function startPrank(){

    const jumpscare =
    document.getElementById("jumpscare");

    const sound =
    document.getElementById("sound");

    jumpscare.style.display = "flex";

    sound.play();

    if(document.documentElement.requestFullscreen){

        document.documentElement.requestFullscreen();
    }
}

</script>

</body>
</html>
