<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial,sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#D91A1A,#000000);
        overflow:hidden;
    }

    .card{
        background:maroon;
        padding:30px;
        width:90%;
        max-width:400px;
        border-radius:25px;
        text-align:center;
        box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    h1{
        color:#420D09;
        margin-bottom:15px;
    }

    p{
        margin-bottom:20px;
        color:#444;
    }

    .cake{
        width:200px;
        border-radius:20px;
        margin-bottom:20px;
    }

    button{
        padding:14px 28px;
        border:none;
        border-radius:999px;
        background:#808080;
        color:white;
        font-size:18px;
        cursor:pointer;
    }

    button:hover{
        transform:scale(1.05);
    }

    #jumpscare{
        position:fixed;
        inset:0;
        background:black;
        display:none;
        justify-content:center;
        align-items:center;
        z-index:9999;
    }

    #jumpscare img{
        width:100%;
        height:100%;
        object-fit:cover;
        animation:shake 0.07s infinite;
    }

    @keyframes shake{
        0%{transform:translate(3px,3px);}
        25%{transform:translate(-3px,2px);}
        50%{transform:translate(2px,-3px);}
        75%{transform:translate(-2px,-2px);}
        100%{transform:translate(3px,-1px);}
    }
</style>
</head>

<body>

<div class="card">
    <h1>HBD Moza 🥳</h1>

    <p>
        Semoga panjang umur dan sehat selalu :D
    </p>

    <!-- GAMBAR KUE -->
    <img class="cake" src="cake.gif" alt="cake">

    <br>

    <button onclick="startPrank()">
        Foto Kenangan🎁
    </button>
</div>

<!-- JUMPSCARE -->
<div id="jumpscare">
    <img src="jumpscare.png" alt="jumpscare">

    <audio id="sound">
        <source src="scream.mp3" type="audio/mpeg">
    </audio>
</div>

<script>
function startPrank(){

    const jumpscare = document.getElementById("jumpscare");
    const sound = document.getElementById("sound");

    jumpscare.style.display = "flex";

    sound.play();

    if(document.documentElement.requestFullscreen){
        document.documentElement.requestFullscreen();
    }
}
</script>

</body>
</html>
